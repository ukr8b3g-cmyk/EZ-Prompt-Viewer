name: Regression and Windows package checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
        env:
          DESIGNER_EXHAUSTIVE: '1'
      - run: npm run test:browser
        env:
          CHROME_PATH: /usr/bin/google-chrome
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build:check
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify unpacked runtime resources
        shell: pwsh
        run: |
          $resources = 'dist/win-unpacked/resources'
          foreach ($name in @('avif_prompt_viewer.html','designer_adapters.js','workflow_adapter.js')) {
            if (-not (Test-Path "$resources/$name")) { throw "Missing packaged resource: $name" }
            if ((Get-Item "$resources/$name").Length -eq 0) { throw "Empty packaged resource: $name" }
          }
