# The one-time publisher was removed after v1.2.0 was published.
# This workflow can only read and verify the existing release; it cannot republish it.
name: Verify published v1.2.0 Windows installer
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-v1.2.0.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'ukr8b3g-cmyk/EZ-Prompt-Viewer' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify published bytes, source tag, manifest and previous releases
        uses: actions/github-script@v7
        with:
          script: |
            const assert = require('node:assert/strict');
            const crypto = require('node:crypto');
            const {owner, repo} = context.repo;
            const tag = 'v1.2.0';
            const source = '61ebd3aed4ff74de8f82fd652fe0fd64dd0bf537';
            const sha256 = 'bfb139958b79180337ea1127f5efa4762fe080a06723e4063475aee9370bf08c';
            const expected = [
              {id:615472999,name:'EZ-Prompt-Viewer-Setup.exe',size:120443947,digest:'sha256:'+sha256},
              {id:615473155,name:'SHA256SUMS.txt',size:94,digest:'sha256:6d81d2430d6516f3df7001b458abdbd4fdb22d126d2a64158f6ff3e5eaff75eb'},
              {id:615473174,name:'build-verification.json',size:491,digest:'sha256:ffa5af2c8069ca1d05718442931148dd52d46599ae38e3880061130fea462177'}
            ];
            const previous = [
              {id:397221928,tag:'v1.1.0',assets:[
                {id:590593599,name:'EZ-Prompt-Viewer-Setup.exe',size:120417719,digest:'sha256:a22e7c51d7f97616f2cff7f252e1550614dc90e9fcf51ba2257b3d7cc9e58e8c'},
                {id:590593597,name:'SHA256SUMS.txt',size:94,digest:'sha256:8f974814a3f56e2e3c5d66837d4c09a94f540d072013a1cbe8770e174e1dceea'}
              ]},
              {id:341885256,tag:'v1.0.1',assets:[
                {id:489651007,name:'EZ-Prompt-Viewer-Setup.exe',size:93772953,digest:'sha256:58488fc0013ad7c7c45556722dd21f9f7a693843a2abbb71e716cb91f8e9d799'}
              ]}
            ];
            const release = (await github.rest.repos.getReleaseByTag({owner,repo,tag})).data;
            assert.equal(release.id,404686634);
            assert.equal(release.draft,false);
            assert.equal(release.prerelease,false);
            assert.equal(release.target_commitish,source);
            assert.equal(release.assets.length,expected.length);
            const ref = (await github.rest.git.getRef({owner,repo,ref:`tags/${tag}`})).data;
            assert.equal(ref.object.sha,source);
            const describe = a => ({id:a.id,name:a.name,size:a.size,digest:a.digest});
            const hash = bytes => crypto.createHash('sha256').update(bytes).digest('hex');
            for (const item of expected) {
              const asset = release.assets.find(a=>a.id===item.id);
              assert.ok(asset,`Missing asset ${item.name}`);
              assert.deepEqual(describe(asset),item);
              // Read the post-publication URL; draft upload responses can use a temporary tag.
              assert.equal(asset.browser_download_url,`https://github.com/${owner}/${repo}/releases/download/${tag}/${item.name}`);
              const response = await fetch(asset.browser_download_url);
              assert.ok(response.ok,`Public download ${item.name}: HTTP ${response.status}`);
              const bytes = Buffer.from(await response.arrayBuffer());
              assert.equal(bytes.length,item.size);
              assert.equal('sha256:'+hash(bytes),item.digest);
              if (item.name.endsWith('.exe')) assert.equal(bytes.subarray(0,2).toString(),'MZ');
              if (item.name==='SHA256SUMS.txt') assert.equal(bytes.toString().trim(),`${sha256}  EZ-Prompt-Viewer-Setup.exe`);
              if (item.name==='build-verification.json') {
                const manifest = JSON.parse(bytes);
                assert.equal(manifest.version,'1.2.0');
                assert.equal(manifest.sourceCommit,source);
                assert.equal(manifest.architecture,'x64');
                assert.equal(manifest.installerSignature,'NotSigned');
                assert.equal(manifest.sha256,sha256);
                assert.equal(manifest.installedResources,'verified byte-for-byte');
                assert.equal(manifest.installedElectronSmoke,'passed');
              }
              core.info(`Verified public bytes: ${item.name}, ${bytes.length} bytes, SHA256 ${hash(bytes)}`);
            }
            for (const saved of previous) {
              const current = (await github.rest.repos.getRelease({owner,repo,release_id:saved.id})).data;
              assert.deepEqual({id:current.id,tag:current.tag_name,assets:current.assets.map(describe)},saved);
              core.info(`Previous release unchanged: ${saved.tag}`);
            }
            core.info(`Verified release: ${release.html_url}`);
