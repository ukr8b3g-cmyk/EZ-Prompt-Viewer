name: Publish EZ Prompt Viewer v1.1.0

on:
  push:
    branches:
      - maintenance/phase1-build

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Publish v1.1.0 release'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: npm ci --no-audit --no-fund

      - name: Validate v1.1.0 source
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -ne "1.1.0") { throw "package.json version is $version, expected 1.1.0" }
          node --check main.js
          node -e "const fs=require('fs'); const html=fs.readFileSync('avif_prompt_viewer.html','utf8'); const m=html.match(/<script>([\\s\\S]*?)<\\/script>/); if(!m) throw new Error('script block missing'); new Function(m[1]); if(!html.includes('const appVersion = \"1.1.0\"')) throw new Error('appVersion mismatch'); console.log('v1.1.0 source validation OK');"

      - name: Build Windows installer
        shell: pwsh
        run: npm run build -- --publish never

      - name: Prepare release assets
        shell: pwsh
        run: |
          $source = "dist\EZ Prompt Viewer Setup.exe"
          $target = "dist\EZ-Prompt-Viewer-Setup.exe"
          if (-not (Test-Path $source)) { throw "Installer not found: $source" }
          Copy-Item $source $target -Force
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLower()
          "$hash  EZ-Prompt-Viewer-Setup.exe" | Set-Content "dist\SHA256SUMS.txt" -Encoding ascii
          Write-Host "SHA256: $hash"
          Write-Host "Bytes: $((Get-Item $target).Length)"

      - name: Create release notes
        shell: pwsh
        run: |
          @'
          # EZ Prompt Viewer v1.1.0

          This release adds first-class Krea2 and Qwen Image 2.1 metadata support.

          ## Highlights

          - Krea2 metadata support, including active model, text encoder, VAE, LoRA, sampler, scheduler, denoise, seed, steps, CFG, and size
          - Qwen Image 2.1 support with output-slot-aware Positive / Negative prompt resolution
          - ComfySwitchNode and upstream structured prompt routing support
          - Structured JSON prompts are preserved by Format Prompt
          - Improved Krea2 Element Framing / BBOX metadata handling
          - Core ComfyUI Save Image / Save Image Advanced prompt/workflow metadata supported
          - File loading, folder drag-and-drop, object URL cleanup, and external URL handling improvements
          - Electron 44.4.5 / electron-builder 26.16.1

          Windows GUI operation check: PASS.

          ## 日本語

          Krea2 と Qwen Image 2.1 のメタデータ対応を正式追加しました。

          - Qwen Image 2.1 の Positive / Negative を output slot で正しく分離
          - Krea2 の実使用 Model / Text Encoder / VAE / LoRA / Sampling 設定を取得
          - Structured JSON Prompt を保持
          - ComfyUI Core Save Image / Save Image Advanced の prompt / workflow メタデータに対応
          - Krea2 Element Framing / BBOX 対応を改善
          - Windows GUI動作確認 PASS

          ## Download

          - EZ-Prompt-Viewer-Setup.exe — Windows installer
          - SHA256SUMS.txt — SHA-256 checksum

          Note: the Windows installer is currently unsigned.
          '@ | Set-Content "release-notes.md" -Encoding utf8

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $targetCommit = git rev-parse HEAD
          $args = @(
            "release", "create", "v1.1.0",
            "dist/EZ-Prompt-Viewer-Setup.exe#Windows Installer",
            "dist/SHA256SUMS.txt#SHA-256 checksum",
            "--repo", "$env:GITHUB_REPOSITORY",
            "--target", "$targetCommit",
            "--title", "EZ Prompt Viewer v1.1.0",
            "--notes-file", "release-notes.md",
            "--latest"
          )
          gh @args
